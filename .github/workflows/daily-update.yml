name: Daily Market Report Update

on:
  schedule:
    # GitHub Actions 的 cron 一律按 UTC 解析，on.schedule 不支持 timezone 字段。
    # UTC 00:30 = 北京时间 08:30，一早运行，报告内容为「最近一个已收盘交易日」。
    # 周二~周六早分别对应生成周一~周五的报告，正好覆盖每个交易日且不重不漏；
    # 前一交易日数据在前一晚 19:00 后已由 Tushare 更新完毕。
    # 避开整点可减少 GitHub 定时任务的排队延迟。
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "手动指定交易日 YYYYMMDD（留空则取最近一个已收盘交易日）"
        required: false
        type: string

# EndBug/add-and-commit 需要写权限，否则推送会报 permission denied。
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate html report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # 定时触发时为空，脚本会自动解析最近交易日；
          # 手动触发时可在输入框填 YYYYMMDD 补跑历史报告。
          TRADE_DATE: ${{ github.event.inputs.trade_date }}
        run: python gen_report.py

      - name: Upload html report
        uses: actions/upload-artifact@v4
        with:
          name: market-review-${{ github.run_number }}
          path: market-review-*.html
          if-no-files-found: error
          retention-days: 30

      - name: Commit & push updated html
        uses: EndBug/add-and-commit@v9
        with:
          # 文件名随交易日变化：market-review-<YYYYMMDD>.html
          add: "market-review-*.html"
          message: "auto update market report from tushare"
          default_author: github_actions
