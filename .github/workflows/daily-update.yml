name: Daily Market Report Update

on:
  schedule:
    # GitHub Actions 的 cron 一律按 UTC 解析，on.schedule 不支持 timezone 字段。
    # UTC 12:00 = 北京时间 20:00，晚于 Tushare 行情接口约 19:00 的更新时点。
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "手动指定交易日 YYYYMMDD（留空则自动解析最近交易日）"
        required: false
        type: string

# EndBug/add-and-commit 需要写权限，否则推送会报 permission denied。
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate html report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # 定时触发时为空，脚本会自动解析最近交易日；
          # 手动触发时可在输入框填 YYYYMMDD 补跑历史报告。
          TRADE_DATE: ${{ github.event.inputs.trade_date }}
        run: python gen_report.py

      - name: Commit & push updated html
        uses: EndBug/add-and-commit@v9
        with:
          # 文件名随交易日变化：market-review-<YYYYMMDD>.html
          add: "market-review-*.html"
          message: "auto update market report from tushare"
          default_author: github_actions
